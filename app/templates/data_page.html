<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinMark {{ page_title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #e9f6ff 0%, #d8ecff 100%);
            color: #001b3d;
            min-height: 100vh;
        }

        .data-layout {
            display: flex;
            min-height: 100vh;
        }

        .data-sidebar {
            width: 230px;
            background: #062c57;
            color: white;
            padding: 24px 16px;
            flex-shrink: 0;
        }

        .data-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 38px;
        }

        .data-brand-badge {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: #d9efff;
            color: #006eff;
            font-weight: 900;
        }

        .data-brand h5 {
            margin: 0;
            font-weight: 900;
        }

        .data-sidebar nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 16px;
            border-radius: 11px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .data-sidebar nav a:hover,
        .data-sidebar nav a.active {
            background: rgba(255, 255, 255, 0.16);
        }

        .data-main {
            flex: 1;
            padding: 36px;
        }

        .data-topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
        }

        .data-section-label {
            color: #006eff;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .data-topbar h1 {
            font-size: 42px;
            font-weight: 950;
            margin-bottom: 8px;
            color: #001b3d;
        }

        .data-description {
            color: #48627e;
            margin: 0;
        }

        .data-logout-btn {
            background: #062c57;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 900;
        }

        .data-logout-btn:hover {
            background: #031f40;
            color: white;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 22px 60px rgba(0, 55, 120, 0.08);
            margin-bottom: 22px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 14px 40px rgba(0, 55, 120, 0.05);
        }

        .summary-card span {
            color: #3d5673;
            font-size: 13px;
            font-weight: 900;
        }

        .summary-card h2 {
            margin-top: 10px;
            color: #002b60;
            font-size: 32px;
            font-weight: 950;
        }

        .summary-card p {
            color: #7690ad;
            font-size: 13px;
            margin-bottom: 0;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 1px solid #cfddeb;
            color: #001b3d;
            font-size: 14px;
            font-weight: 900;
            padding: 14px 12px;
        }

        .table tbody td {
            padding: 13px 12px;
            color: #001b3d;
            border-bottom: 1px solid #dce8f4;
        }

        .badge-soft-warning {
            background: #ffc107;
            color: #001b3d;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 900;
        }

        .badge-soft-success {
            background: #d8ffe5;
            color: #007a35;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 900;
        }

        .monitoring-code {
            background: #f5f9fd;
            border-radius: 16px;
            padding: 20px;
            color: #001b3d;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .section-title {
            font-size: 22px;
            font-weight: 950;
            margin-bottom: 18px;
            color: #001b3d;
        }

        .note-text {
            color: #48627e;
            margin-bottom: 20px;
        }

        @media (max-width: 1000px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .data-topbar {
                flex-direction: column;
                gap: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="data-layout">
        <aside class="data-sidebar">
            <div class="data-brand">
                <div class="data-brand-badge">FM</div>
                <h5>FinMark</h5>
            </div>

            <nav>
                <a href="/dashboard" id="nav-dashboard">Dashboard</a>
                <a href="/orders" id="nav-orders">Orders</a>
                <a href="/products" id="nav-products">Services</a>
                <a href="/payments" id="nav-payments">Payments</a>
                <a href="/reports" id="nav-reports">Reports</a>
                <a href="/monitoring" id="nav-monitoring">Monitoring</a>
            </nav>
        </aside>

        <main class="data-main">
            <div class="data-topbar">
                <div>
                    <p class="data-section-label">FinMark Platform</p>
                    <h1>{{ page_title }}</h1>
                    <p class="data-description">{{ page_description }}</p>
                </div>

                <button class="data-logout-btn" onclick="logout()">Logout</button>
            </div>

            <div id="contentArea" class="data-card">
                Loading data...
            </div>
        </main>
    </div>

    <script>
        const pageType = "{{ page_type }}";
        const token = localStorage.getItem("finmark_token");

        function logout() {
            localStorage.removeItem("finmark_token");
            localStorage.removeItem("finmark_user");
            window.location.href = "/";
        }

        function requireEmployeeToken() {
            if (!token) {
                window.location.href = "/";
                return false;
            }

            return true;
        }

        function money(value) {
            return "₱" + Number(value || 0).toLocaleString();
        }

        function setActiveNav() {
            const nav = document.getElementById(`nav-${pageType}`);
            if (nav) {
                nav.classList.add("active");
            }
        }

        async function fetchJson(url, protectedRoute = false) {
            const options = {};

            if (protectedRoute) {
                options.headers = {
                    "Authorization": `Bearer ${token}`
                };
            }

            const response = await fetch(url, options);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Unable to load data.");
            }

            return data;
        }

        function renderTable(headers, rows) {
            if (!rows || rows.length === 0) {
                return "<p class='text-muted'>No records found yet.</p>";
            }

            return `
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>${headers.map(header => `<th>${header}</th>`).join("")}</tr>
                        </thead>
                        <tbody>
                            ${rows.join("")}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function loadOrders() {
            const data = await fetchJson("/api/orders/list");

            const rows = data.orders.map(order => `
                <tr>
                    <td>${order.id}</td>
                    <td>${order.customer_name}</td>
                    <td>${order.customer_email}</td>
                    <td>${order.client_type}</td>
                    <td>${order.service_name}</td>
                    <td>${money(order.base_price)}</td>
                    <td><span class="badge-soft-warning">${order.order_status}</span></td>
                </tr>
            `);

            document.getElementById("contentArea").innerHTML = `
                <h3 class="section-title">Customer Service Orders</h3>
                ${renderTable(
                    ["ID", "Customer", "Email", "Client Type", "Service", "Amount", "Status"],
                    rows
                )}
            `;
        }

        async function loadProducts() {
            const data = await fetchJson("/api/services/catalog");

            const rows = data.services.map(service => `
                <tr>
                    <td>${service.id}</td>
                    <td>${service.service_name}</td>
                    <td>${service.service_category}</td>
                    <td>${money(service.base_price)}</td>
                    <td>${service.description}</td>
                    <td><span class="badge-soft-success">Active</span></td>
                </tr>
            `);

            document.getElementById("contentArea").innerHTML = `
                <h3 class="section-title">FinMark Service Catalog</h3>
                <p class="note-text">
                    Product Service is represented as FinMark's service catalog because FinMark provides business services.
                </p>
                ${renderTable(["ID", "Service", "Category", "Base Price", "Description", "Status"], rows)}
            `;
        }

        async function loadPayments() {
            requireEmployeeToken();

            const data = await fetchJson("/api/payments/summary", true);

            const rows = data.recent_payments.map(payment => `
                <tr>
                    <td>${payment.id}</td>
                    <td>${payment.order_id}</td>
                    <td>${money(payment.amount)}</td>
                    <td>${payment.payment_method}</td>
                    <td><span class="badge-soft-warning">${payment.payment_status}</span></td>
                    <td>${payment.created_at}</td>
                </tr>
            `);

            document.getElementById("contentArea").innerHTML = `
                <div class="summary-grid mb-4">
                    <div class="summary-card">
                        <span>Total Records</span>
                        <h2>${data.total_payment_records}</h2>
                        <p>Payment records created</p>
                    </div>

                    <div class="summary-card">
                        <span>Pending Payments</span>
                        <h2>${data.pending_payments}</h2>
                        <p>Awaiting completion</p>
                    </div>

                    <div class="summary-card">
                        <span>Total Amount</span>
                        <h2>${money(data.total_payment_amount)}</h2>
                        <p>From service orders</p>
                    </div>
                </div>

                <h3 class="section-title">Payment Records</h3>
                ${renderTable(["Payment ID", "Order ID", "Amount", "Method", "Status", "Created At"], rows)}
            `;
        }

        async function loadReports() {
            requireEmployeeToken();

            const financials = await fetchJson("/api/financials/summary", true);
            const orders = await fetchJson("/api/orders/summary", true);
            const payments = await fetchJson("/api/payments/summary", true);
            const products = await fetchJson("/api/products/summary", true);

            document.getElementById("contentArea").innerHTML = `
                <div class="summary-grid">
                    <div class="summary-card">
                        <span>Total Revenue</span>
                        <h2>${money(financials.total_revenue)}</h2>
                        <p>From service orders</p>
                    </div>

                    <div class="summary-card">
                        <span>Estimated Net Profit</span>
                        <h2>${money(financials.net_profit)}</h2>
                        <p>Calculated from projected revenue</p>
                    </div>

                    <div class="summary-card">
                        <span>Service Orders</span>
                        <h2>${orders.total_orders}</h2>
                        <p>Current database records</p>
                    </div>

                    <div class="summary-card">
                        <span>Payment Records</span>
                        <h2>${payments.total_payment_records}</h2>
                        <p>Created from orders</p>
                    </div>

                    <div class="summary-card">
                        <span>Available Services</span>
                        <h2>${products.active_services}</h2>
                        <p>Service catalog count</p>
                    </div>

                    <div class="summary-card">
                        <span>Pending Revenue</span>
                        <h2>${money(financials.pending_revenue)}</h2>
                        <p>Payments awaiting completion</p>
                    </div>
                </div>
            `;
        }

        async function loadMonitoring() {
            const auditLogs = await fetchJson("/api/audit-logs");
            const events = await fetchJson("/api/events");
            const services = await fetchJson("/api/system/services");

            const logRows = auditLogs.logs.slice(0, 10).map(log => `
                <tr>
                    <td>${log.id}</td>
                    <td>${log.action}</td>
                    <td>${log.actor_email || "System"}</td>
                    <td>${log.details}</td>
                    <td>${log.created_at}</td>
                </tr>
            `);

            const eventRows = events.events.slice(0, 10).map(event => `
                <tr>
                    <td>${event.id}</td>
                    <td>${event.event_type}</td>
                    <td>${event.source_service}</td>
                    <td>${event.status}</td>
                    <td>${event.created_at}</td>
                </tr>
            `);

            document.getElementById("contentArea").innerHTML = `
                <h3 class="section-title">Service Health</h3>
                <pre class="monitoring-code">${JSON.stringify(services, null, 2)}</pre>

                <h3 class="section-title mt-4">Recent Audit Logs</h3>
                ${renderTable(["ID", "Action", "Actor", "Details", "Created At"], logRows)}

                <h3 class="section-title mt-4">Recent Event Bus Records</h3>
                ${renderTable(["ID", "Event Type", "Source Service", "Status", "Created At"], eventRows)}
            `;
        }

        async function loadPage() {
            try {
                setActiveNav();

                if (pageType === "orders") {
                    await loadOrders();
                }

                if (pageType === "products") {
                    await loadProducts();
                }

                if (pageType === "payments") {
                    await loadPayments();
                }

                if (pageType === "reports") {
                    await loadReports();
                }

                if (pageType === "monitoring") {
                    await loadMonitoring();
                }

            } catch (error) {
                document.getElementById("contentArea").innerHTML = `
                    <div class="alert alert-danger">
                        ${error.message}
                    </div>
                `;
            }
        }

        loadPage();
    </script>
</body>
</html>
