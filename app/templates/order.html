<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinMark Service Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #e9f6ff 0%, #d8ecff 100%);
            min-height: 100vh;
            color: #001b3d;
        }

        .order-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .order-card {
            width: 100%;
            max-width: 620px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 34px;
            box-shadow: 0 24px 70px rgba(0, 55, 120, 0.14);
        }

        .order-header {
            margin-bottom: 24px;
        }

        .order-header .brand-badge {
            margin-bottom: 18px;
        }

        .order-header p {
            color: #006eff;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .order-header h1 {
            font-weight: 950;
            color: #001b3d;
            margin-bottom: 6px;
        }

        .order-header span {
            color: #48627e;
        }

        .order-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
        }

        .order-actions a {
            color: #062c57;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="order-page">
        <div class="order-card">
            <div class="order-header">
                <div class="brand-badge">FM</div>
                <p>FinMark Customer Portal</p>
                <h1>Service Order</h1>
                <span>Submit a FinMark service request for your business.</span>
            </div>

            <form id="orderForm">
                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text" id="customerName" class="form-control modern-input" placeholder="Enter customer name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Customer Email</label>
                    <input type="email" id="customerEmail" class="form-control modern-input" placeholder="Enter customer email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Client Type</label>
                    <select id="clientType" class="form-select modern-input">
                        <option value="">Select client type</option>
                        <option value="retail">Retail</option>
                        <option value="e-commerce">E-commerce</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="manufacturing">Manufacturing</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">FinMark Service</label>
                    <select id="serviceId" class="form-select modern-input">
                        <option value="">Loading services...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Order Notes</label>
                    <textarea id="orderNotes" class="form-control modern-input" rows="3" placeholder="Optional notes about the business need"></textarea>
                </div>

                <button type="submit" id="submitButton" class="btn modern-btn w-100">
                    Submit Service Order
                </button>
            </form>

            <div id="message" class="p-2 px-3 shadow-lg mt-3 fw-bold rounded-3" hidden="true"></div>

            <div class="order-actions">
                <a href="#" onclick="logout()">Logout</a>
                <a href="/dashboard" id="dashboardLink" hidden="true">Employee Dashboard</a>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("finmark_token");
        const user = JSON.parse(localStorage.getItem("finmark_user"));

        if (!token || !user) {
            window.location.href = "/";
        }

        const serviceSelect = document.getElementById("serviceId");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");
        const dashboardLink = document.getElementById("dashboardLink");

        document.getElementById("customerName").value = user.name || "";
        document.getElementById("customerEmail").value = user.email || "";

        if (user.role !== "customer") {
            dashboardLink.removeAttribute("hidden");
            showMessage("Employee account detected. You may still submit a demo service order, or return to the employee dashboard.", true);
        }

        async function loadServices() {
            const response = await fetch("/api/services/catalog");
            const data = await response.json();

            serviceSelect.innerHTML = '<option value="">Select FinMark service</option>';

            data.services.forEach(service => {
                const option = document.createElement("option");
                option.value = service.id;
                option.textContent = `${service.service_name} - ₱${service.base_price.toLocaleString()}`;
                serviceSelect.appendChild(option);
            });
        }

        function showMessage(text, success) {
            message.innerText = text;
            message.removeAttribute("hidden");
            message.classList.remove("bg-danger", "bg-success");
            message.classList.add(success ? "bg-success" : "bg-danger");
        }

        function logout() {
            localStorage.removeItem("finmark_token");
            localStorage.removeItem("finmark_user");
            window.location.href = "/";
        }

        document.getElementById("orderForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            message.setAttribute("hidden", true);
            button.disabled = true;
            button.innerText = "Submitting...";

            const payload = {
                customer_name: document.getElementById("customerName").value,
                customer_email: document.getElementById("customerEmail").value,
                client_type: document.getElementById("clientType").value,
                service_id: document.getElementById("serviceId").value || null,
                order_notes: document.getElementById("orderNotes").value
            };

            const response = await fetch("/api/orders/place", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                showMessage(data.detail || "Unable to place service order.", false);
                button.disabled = false;
                button.innerText = "Submit Service Order";
                return;
            }

            showMessage("Service order submitted successfully. Payment record and event bus records were created.", true);

            document.getElementById("clientType").value = "";
            document.getElementById("serviceId").value = "";
            document.getElementById("orderNotes").value = "";

            button.disabled = false;
            button.innerText = "Submit Service Order";
        });

        loadServices();
    </script>
</body>
</html>
