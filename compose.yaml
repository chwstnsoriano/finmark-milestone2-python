name: finmark-scaling

services:
  order-db:
    image: postgres:18-alpine
    container_name: finmark-order-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: finmark_orders
      POSTGRES_USER: finmark_order
      POSTGRES_PASSWORD: finmark_order_demo_password

    ports:
      - "5433:5432"

    volumes:
      - order_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://finmark_order:finmark_order_demo_password@order-db:5432/finmark_orders"

    depends_on:
      order-db:
        condition: service_healthy

    expose:
      - "8001"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  order-lb:
    image: nginx:1.30.4-alpine
    restart: unless-stopped

    volumes:
      - ./infrastructure/nginx/order-service.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      order-service:
        condition: service_started

    ports:
      - "8001:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/lb-health >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  finmark-app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      ORDER_SERVICE_URL: "http://order-lb:8080"
      ORDER_SERVICE_TIMEOUT_SECONDS: "5"
      ORDER_SERVICE_FALLBACK_ENABLED: "true"

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/system/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  order_postgres_data:
