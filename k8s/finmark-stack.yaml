apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-db-pvc
  namespace: finmark
spec:
  storageClassName: hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: finmark
spec:
  clusterIP: None
  selector:
    app: order-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-db
  namespace: finmark
spec:
  serviceName: order-db
  replicas: 1

  selector:
    matchLabels:
      app: order-db

  template:
    metadata:
      labels:
        app: order-db

    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: finmark-secrets
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finmark-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finmark-secrets
                  key: POSTGRES_PASSWORD

          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - finmark_order
                - -d
                - finmark_orders
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - finmark_order
                - -d
                - finmark_orders
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - finmark_order
                - -d
                - finmark_orders
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: order-db-storage
              mountPath: /var/lib/postgresql

      volumes:
        - name: order-db-storage
          persistentVolumeClaim:
            claimName: order-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: finmark
spec:
  type: ClusterIP

  selector:
    app: order-service

  ports:
    - name: http
      port: 8001
      targetPort: 8001

---
apiVersion: v1
kind: Service
metadata:
  name: order-service-demo
  namespace: finmark
spec:
  type: NodePort

  selector:
    app: order-service

  ports:
    - name: http
      port: 8001
      targetPort: 8001
      nodePort: 30081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: finmark
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: finmark-order-service:k8s-v1
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8001

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finmark-secrets
                  key: DATABASE_URL

          startupProbe:
            httpGet:
              path: /health/live
              port: 8001
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: finmark-app
  namespace: finmark
spec:
  type: NodePort

  selector:
    app: finmark-app

  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmark-app
  namespace: finmark
spec:
  replicas: 1

  selector:
    matchLabels:
      app: finmark-app

  template:
    metadata:
      labels:
        app: finmark-app

    spec:
      containers:
        - name: finmark-app
          image: finmark-app:k8s-v1
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: finmark-secrets
                  key: SECRET_KEY

            - name: PASSWORD_SALT
              valueFrom:
                secretKeyRef:
                  name: finmark-secrets
                  key: PASSWORD_SALT

            - name: TOKEN_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: finmark-secrets
                  key: TOKEN_ALGORITHM

            - name: CACHE_TTL_SECONDS
              value: "30"

            - name: ORDER_SERVICE_URL
              value: http://order-service:8001

            - name: ORDER_SERVICE_TIMEOUT_SECONDS
              value: "5"

            - name: ORDER_SERVICE_FALLBACK_ENABLED
              value: "true"

          startupProbe:
            httpGet:
              path: /api/system/health
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/system/health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/system/health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3